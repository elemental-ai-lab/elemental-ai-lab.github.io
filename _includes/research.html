<div class="research-grid">
  {%- for area in site.data.research %}
  <article class="research-area" id="{{ area.id }}" tabindex="-1">
    <h3>{{ area.title | escape }}</h3>
    <p>{{ area.text | escape }}</p>
    <h4>Selected work</h4>
    <ul class="research-work">
      {%- for item in area.work %}
      <li><a href="{{ item.url | escape }}">{{ item.title | escape }}</a> <span>{{ item.venue | escape }}</span></li>
      {%- endfor %}
    </ul>
  </article>
  {%- endfor %}
</div>
